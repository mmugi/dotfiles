# ------
# prefix
# ------

unbind C-b #default
set -g prefix C-q
bind C-q send-prefix

# ------
# colors
# ------

# tmux が背景を塗るところは、fgもbgも以下から指定して固定する。
# 背景を塗らないところは terminal やパレットの色名を指定して
# ターミナル設定に任せる(テーマのlight, dark, 透過にかかわらず見やすくするため)。
%hidden TMUX_COLOR_BLACK='#050a15'
%hidden TMUX_COLOR_YELLOW='#fcdc00'
%hidden TMUX_COLOR_TURQUOISE='#0becca'
%hidden TMUX_COLOR_PURPLE='#948cf3'
%hidden TMUX_COLOR_BLUE='#417cff'
%hidden TMUX_COLOR_PINK='#ec94ad'

# ----------------
# general settings
# ----------------

set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g display-panes-time 2000
set -g mode-keys vi
if-shell 'test -n "$TMUX_SHELL"' 'set -g default-shell "$TMUX_SHELL"'

# -------------------------
# custom keyboard shortcuts
# -------------------------

bind C-o select-pane -t :.+
bind C-p previous-window
bind C-n next-window
bind r source-file ~/.config/tmux/tmux.conf \; display '.tmux.conf reloaded'

# popup
bind C-a display-popup -xC -yC -w90% -h90% -E /usr/bin/env bash -c '\
  if [ "$(tmux display-message -p "#{session_name}")" == "popup" ]; then \
    tmux detach-client; \
  else \
    tmux attach -t popup || tmux new-session -s popup; \
  fi'

# -----------
# appearances
# -----------

# status line
set -g status-interval 1
set -g status-position bottom
set -g status-justify centre
set -g status-style fg=terminal,bg=terminal
set -g status-left-length 32
# prefix・window mode・synchronize-panes・マーク済みペインの有無を表示する。
# 条件分岐の中ではカンマが区切りになるため、スタイルは #[fg=..]#[bg=..] と分けて書く。
%hidden TMUX_MODE_PREFIX="#[fg=${TMUX_COLOR_BLACK}]#[bg=${TMUX_COLOR_PINK}] prefix "
%hidden TMUX_MODE_WINDOW="#[fg=${TMUX_COLOR_BLACK}]#[bg=${TMUX_COLOR_BLUE}] #{s/-mode//:pane_mode} "
%hidden TMUX_MODE_SYNC="#[fg=${TMUX_COLOR_BLACK}]#[bg=${TMUX_COLOR_YELLOW}] sync "
%hidden TMUX_MODE_MARK="#[fg=${TMUX_COLOR_BLACK}]#[bg=${TMUX_COLOR_TURQUOISE}] mark "
%hidden TMUX_MODE_INDICATOR="#{?client_prefix,#[default] ${TMUX_MODE_PREFIX}}#{?pane_in_mode,#[default] ${TMUX_MODE_WINDOW}}#{?synchronize-panes,#[default] ${TMUX_MODE_SYNC}}#{?pane_marked_set,#[default] ${TMUX_MODE_MARK}}#[default]"
set -g status-right "${TMUX_MODE_INDICATOR} %Y/%m/%d(%a) %H:%M:%S "
set -g status-right-length 80
set -g window-status-separator ''
set -g window-status-format ' #I '
set -g window-status-current-format "#[fg=green,bold]*#[default]#I "
set -g window-status-current-style default
set -g popup-style default
set -g popup-border-style default
if-shell 'test -z "$SSH_CONNECTION"' {
  set -g status-left "#[fg=${TMUX_COLOR_BLACK},bg=${TMUX_COLOR_PURPLE}]  #S:#{pane_current_command}  #[default]"
  set -g message-style "fg=${TMUX_COLOR_BLACK},bg=${TMUX_COLOR_PURPLE},fill=${TMUX_COLOR_PURPLE}"
} {
  set -g status-left "#[fg=${TMUX_COLOR_BLACK},bg=${TMUX_COLOR_TURQUOISE}]  #S:#{pane_current_command}  #[default]"
  set -g message-style "fg=${TMUX_COLOR_BLACK},bg=${TMUX_COLOR_TURQUOISE},fill=${TMUX_COLOR_TURQUOISE}"
}

# mode
set -g mode-style "fg=${TMUX_COLOR_BLACK},bg=${TMUX_COLOR_BLUE}"

# pane border
set -g pane-border-lines simple
set -g pane-border-style fg=terminal,bg=terminal,dim
set -g pane-active-border-style fg=blue,bg=terminal,bold

# clock
set -g clock-mode-style 24
set -g clock-mode-colour terminal

# starship configs

format = """
$time\
($username$hostname )\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
(\
  (${env_var.KUBECTL_ENV} )\
)\
$battery\
$shlvl\
$character\
"""

right_format = """
$cmd_duration\
$status\
"""

add_newline = false
palette = 'mypalette'

[battery]
charging_symbol = '🔌'
discharging_symbol = '🪫'

[character]
success_symbol = '[>](purple)'
error_symbol = '[>](red)'

[cmd_duration]
format = '⌛[$duration]($style) '
style = 'gray'

[directory]
truncation_length = 0
truncate_to_repo = false
style = 'none'

[env_var.KUBECTL_ENV]
format = '[$env_value]($style)'
style = 'pink'

[git_branch]
format = '[$branch]($style)'
style = 'gray'

[git_commit]
commit_hash_length = 7
format = '[#$hash(:$tag)]($style) '
style = 'yellow'
tag_disabled = false
tag_symbol = ''

[git_state]
format = '[*$state(\($progress_current/$progress_total\))*]($style) '
style = 'bold yellow'

[git_status]
format = """
[\
  [$conflicted](yellow)\
  [$deleted](red)\
  [$renamed](turquoise)\
  [$modified](pink)\
  [$typechanged](gray)\
  [$staged](turquoise)\
  [$untracked](gray)\
  [$ahead_behind](sky)\
  [$stashed](blue)\
]($style) \
"""
style = ''
conflicted = '!'
deleted = '-'
renamed = '~'
modified = '*'
typechanged = ''
staged = '+'
untracked = '?'
stashed = '='

[hostname]
disabled = false
ssh_only = true
format = '[@$hostname]($style)'
style = 'none'

[line_break]
disabled = false

[palettes.mypalette]
blue = '#417cff'
turquoise = '#0becca'
pink = '#ec94ad'
sky = '#7dbbfa'
purple = '#948cf3'
red = '#ea5950'
yellow = '#fcdc00'
gray = '#6e7174'

[shlvl]
disabled = false
threshold = 3
format = '[\[$symbol$shlvl\]]($style) '
symbol = ''
style = 'gray'

[status]
disabled = false
format = '[$status(:$common_meaning$signal_name)]($style) '
pipestatus_format = '\[$pipestatus\] '
pipestatus_segment_format = ' [$status(:$common_meaning$signal_name)]($style) '
style = 'bold red'
pipestatus = true

[time]
disabled = true
format = '[\[$time\]]($style) '
style = 'none'
time_format = '%Y-%m-%dT%H:%M:%S%z'
utc_time_offset = '+9'

[username]
format = '[$user]($style)'
show_always = false
style_user = 'none'
style_root = 'bold red'

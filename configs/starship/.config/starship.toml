# starship configs

format = """
${custom.hostname_default}\
${custom.hostname_prod}\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$shlvl\
$all\
$time\
$cmd_duration\
$battery\
$status\
$line_break\
$username\
$character"""

add_newline = false
palette = 'mypalette'

[battery]
charging_symbol = '🔌'
discharging_symbol = '🪫'

[custom.hostname_default]
command = 'uname -n | cut -d. -f1'
when = 'test -n "$SSH_CONNECTION" && test "$DOTFILES_ENV" != "PROD"'
style = 'green'
format = '@[$symbol$output]($style) '

[custom.hostname_prod]
command = 'uname -n | cut -d. -f1'
when = 'test -n "$SSH_CONNECTION" && test "$DOTFILES_ENV" == "PROD"'
style = 'bold red'
format = '@[$symbol$output]($style) '

[character]
success_symbol = '[>]()'
error_symbol = '[><](red)'

[cmd_duration]
format = '⌛[$duration]($style) '
style = 'bold blue'

[directory]
truncation_length = 8
truncation_symbol = '…/'
truncate_to_repo = false
style = ''

[env_var.KUBECTL_ENV]
format = '[$env_value]($style)'
style = 'red'

[gcloud]
disabled = true
format = '[$symbol$active]($style) '
symbol = '☁️'

[gcloud.region_aliases]
asia-northeast1 = 'tokyo'
asia-northeast2 = 'osaka'

[git_branch]
symbol = '🌱'
format = '[$symbol$branch]($style) '
style = 'bold blue'

[git_commit]
commit_hash_length = 4
tag_symbol = '🔖'

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold pink)'

[git_status]
style = 'bold purple'

[hostname]
disabled = true
ssh_symbol = '🌐'
ssh_only = true
format = '[$ssh_symbol$hostname]($style) '
style = "green"

[palettes.mypalette]
red = '167'
green = '43'
blue = '63'
pink = '175'
purple = '105'

[shlvl]
disabled = false
threshold = 3
format = '[\[$symbol$shlvl\]]($style) '
symbol = ''
style = ''

[status]
disabled = false
format = '[$symbol$status(:$common_meaning$signal_name$maybe_int)]($style) '
style = 'bold red'
symbol = '🔥'
pipestatus = true
map_symbol = true

[time]
disabled = false
format = '\[[$time]($style)\] '
style = 'green'
time_format = '%Y%m%dT%H%M%S'
utc_time_offset = '+9'

[username]
format = '[$user]()'
